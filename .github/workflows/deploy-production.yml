name: Deploy Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Streamlit Cloud deploy hook
        env:
          STREAMLIT_DEPLOY_HOOK: ${{ secrets.STREAMLIT_DEPLOY_HOOK }}
        run: |
          if [ -z "$STREAMLIT_DEPLOY_HOOK" ]; then
            echo "::notice::STREAMLIT_DEPLOY_HOOK is not configured; skipping deploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$STREAMLIT_DEPLOY_HOOK"
